<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-role="semantic-chart">
  <defs>
    <radialGradient id="vox-bg" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#1A232A"/>
      <stop offset="68%" stop-color="#151E25"/>
      <stop offset="100%" stop-color="#0D1419"/>
    </radialGradient>
  </defs>

  <rect data-role="background" x="0" y="0" width="1280" height="720" fill="url(#vox-bg)"/>
  <text x="1210" y="46" text-anchor="end" font-family="Arial, Helvetica, sans-serif"
        font-size="30" font-weight="700" letter-spacing="1" fill="#AEB6C0">Vox</text>

  <!-- The source clip has no in-frame chart title. -->
  <text x="658" y="96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="38" font-weight="700" fill="#F5F7FA">$2 billion</text>

  <!-- One illustrative wealth column from $0 to $2 billion. -->
  <rect data-role="bar" data-entity-id="illustrative-wealth"
        data-value="2" data-unit="billion USD"
        x="646" y="122" width="24" height="495" rx="1"
        fill="#A2A6AA"/>

  <!-- $50 million threshold: 2.5% of the full $2B scale. -->
  <line data-role="threshold" data-value="0.05" data-unit="billion USD"
        x1="580" y1="604.6" x2="760" y2="604.6"
        stroke="#D8DADD" stroke-width="2.5" stroke-dasharray="8 7"/>
  <text x="562" y="613" text-anchor="end"
        font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"
        fill="#F4F5F7">$50 million</text>
  <text data-role="tax-rate" data-value="2" data-unit="percent"
        x="778" y="591" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700"
        fill="#F5F7FA">2%</text>

  <!-- $1 billion threshold: 50% of the full $2B scale. -->
  <line data-role="threshold" data-value="1" data-unit="billion USD"
        x1="580" y1="369.5" x2="760" y2="369.5"
        stroke="#D8DADD" stroke-width="2.5" stroke-dasharray="8 7"/>
  <text x="562" y="378" text-anchor="end"
        font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"
        fill="#F4F5F7">$1 billion</text>
  <text data-role="tax-rate" data-value="3" data-unit="percent"
        x="778" y="356" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700"
        fill="#F5F7FA">3%</text>

  <!-- Zero rate at the bottom of the illustrative wealth scale. -->
  <text data-role="tax-rate" data-value="0" data-unit="percent"
        x="683" y="648" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700"
        fill="#F4F5F7">0%</text>

  <!-- Tax due on the $2B example; roughly the same height as $50M on this scale. -->
  <rect data-role="comparison-mark" x="766" y="599" width="22" height="12"
        rx="2" fill="#FFFFFF"/>
  <text x="796" y="612"
        font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"
        fill="#F4F5F7">$49 million</text>
</svg>
